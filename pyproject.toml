[project]
name = "moodle-mcp-server"
version = "0.1.0"
description = "Moodle LMS integration server for Model Context Protocol"
authors = [{name = "William Shamblin", email = "wjs@shamblin.org"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3,<4",
    "httpx[http2]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits the live Moodle dev instance (course 7299); needs .env creds",
    "offline: pure unit tests, no network",
]

[project.scripts]
moodle-mcp = "moodle_mcp.main:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# main.py and conftest.py deliberately import after runtime setup: main.py
# adjusts sys.path and assigns the shared mcp instance before importing the
# tool modules (whose decorators register against it); conftest.py does the
# same to register tools against a test mcp instance. The ordering is required,
# so E402 (module import not at top) does not apply.
"src/moodle_mcp/main.py" = ["E402"]
"tests/conftest.py" = ["E402"]
